:root{--bg:#e9dfc6;--ivory:#f2e9d3;--sage:#9db39a;--gold:#ffd27a;--deep:#0b1c21;--serif:"Cormorant Garamond",Georgia,"Times New Roman",serif;--sans:Karla,system-ui,"Segoe UI",sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ivory);font-family:var(--serif);overflow:hidden}
#stage{position:fixed;inset:0;overflow:hidden;background:var(--deep);touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}

#go,#again,#dive,#fiesta,#luces{font-style:italic;color:var(--gold);border-bottom:1px solid currentColor;cursor:pointer}
